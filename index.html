<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rishi Chauhan - Unity Game Developer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">

    <!-- Fixed Header -->
    <header class="header">
        <div class="header-content">
            <!-- Left: Profile -->
            <div class="profile">
                <div class="avatar" id="avatar"></div>
                <div class="profile-info">
                    <div class="profile-name" id="profile-name"></div>
                    <div class="profile-title" id="profile-title"></div>
                </div>
            </div>

            <!-- Center: Navigation -->
            <nav class="nav" id="nav" aria-label="Main navigation"></nav>

            <!-- Right: Quick links -->
            <div class="header-links" id="header-links"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">

        <!-- About / Hero Section -->
        <section id="about" class="section">
            <div class="section-container"></div>
        </section>

        <!-- Featured Project Section -->
        <section id="featured" class="section section--featured">
            <div class="section-container section-container--wide"></div>
        </section>

        <!-- More Projects Section -->
        <section id="projects" class="section section--projects">
            <div class="section-container section-container--wide"></div>
        </section>

        <!-- Skills Section -->
        <section id="skills" class="section section--skills">
            <div class="section-container section-container--wide"></div>
        </section>

        <!-- Experience Section -->
        <section id="experience" class="section">
            <div class="section-container"></div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="section">
            <div class="section-container"></div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="footer" id="footer"></footer>

    <script src="data.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
